name: KubeRay Multi-Node E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/kuberay/**"
      - "src/raylings/**"
      - "tests/test_kuberay_e2e.py"
      - ".github/workflows/kuberay-e2e.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "scripts/kuberay/**"
      - "src/raylings/**"
      - "tests/test_kuberay_e2e.py"
      - ".github/workflows/kuberay-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kuberay-e2e-test:
    name: KubeRay Multi-Node E2E Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Create KinD Cluster
        uses: helm/kind-action@v1.12.0
        with:
          config: scripts/kuberay/kind-config.yaml
          cluster_name: raylings-kind
          wait: 120s

      - name: Deploy KubeRay Operator & Cluster
        run: bash scripts/kuberay/setup-kuberay.sh up

      - name: Forward Ray Cluster Ports
        run: bash scripts/kuberay/setup-kuberay.sh forward

      - name: Run KubeRay E2E Integration Tests
        run: |
          RAY_ADDRESS=ray://localhost:10001 uv run pytest tests/test_kuberay_e2e.py -v

      - name: Cluster Diagnostics on Failure
        if: failure()
        run: |
          echo "=== Port Forward Logs ==="
          cat /tmp/kuberay-port-forward.log || true
          echo "=== Pods in all namespaces ==="
          kubectl get pods -A
          echo "=== RayClusters in all namespaces ==="
          kubectl get rayclusters -A
          echo "=== Describe RayClusters ==="
          kubectl describe rayclusters
          echo "=== Ray Head Pod Logs ==="
          kubectl logs -l ray.io/node-type=head --tail=200 || true
          echo "=== KubeRay Operator Logs ==="
          kubectl logs -l app.kubernetes.io/name=kuberay-operator --tail=200 || true

      - name: Teardown KinD Cluster
        if: always()
        run: bash scripts/kuberay/setup-kuberay.sh down || true
