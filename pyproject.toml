[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raylings"
version = "0.1.0"
description = "An interactive, hands-on CLI learning environment for Python Ray"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Fisher" }
]
keywords = [
    "ray",
    "distributed-computing",
    "machine-learning",
    "deep-learning",
    "rustlings",
    "cli",
    "education",
    "interactive-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "ray[default]>=2.30.0",
    "torch>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchfiles>=0.21.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "starlette>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/dnf0/raylings"
Repository = "https://github.com/dnf0/raylings"
Issues = "https://github.com/dnf0/raylings/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "pre-commit>=3.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
raylings = "raylings.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raylings"]

[tool.hatch.build.targets.wheel.force-include]
"exercises" = "raylings/exercises"
"solutions" = "raylings/solutions"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/exercises",
    "/solutions",
    "/tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "docs",
    "build",
    "dist",
    "graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"exercises/**" = ["F841", "F401", "E722", "E402"]
"solutions/**" = ["F841", "F401", "E402"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "heavy: marks heavy multi-process distributed tests (skipped in fast CI)",
    "slow: marks slow tests",
]


