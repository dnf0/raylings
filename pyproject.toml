[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raylings"
version = "0.1.0"
description = "An interactive, hands-on CLI learning environment for Python Ray"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Fisher" }
]
dependencies = [
    "ray[default]>=2.30.0",
    "torch>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchfiles>=0.21.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "pre-commit>=3.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
raylings = "raylings.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raylings"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
