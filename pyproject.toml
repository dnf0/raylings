[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raylings"
version = "0.2.0"
description = "An interactive, hands-on CLI learning environment for Python Ray"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Daniel Fisher" }
]
keywords = [
    "ray",
    "distributed-computing",
    "machine-learning",
    "deep-learning",
    "rustlings",
    "cli",
    "education",
    "interactive-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "ray[default]>=2.30.0",
    "torch>=2.2.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "watchfiles>=0.21.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "pandas>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "starlette>=0.28.0",
]

[project.urls]
Homepage = "https://github.com/dnf0/raylings"
Documentation = "https://dnf0.github.io/raylings/"
Repository = "https://github.com/dnf0/raylings"
Issues = "https://github.com/dnf0/raylings/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "pyright>=1.1.350",
    "pre-commit>=3.7.0",
    "tomli>=2.0.0; python_version < '3.11'",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[project.scripts]
raylings = "raylings.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/raylings"]

[tool.hatch.build.targets.wheel.force-include]
"exercises" = "raylings/exercises"
"solutions" = "raylings/solutions"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/exercises",
    "/solutions",
    "/tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "docs",
    "build",
    "dist",
    "graphify-out",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"exercises/**" = ["F841", "F401", "E722", "E402"]
"solutions/**" = ["F841", "F401", "E402"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "heavy: marks heavy multi-process distributed tests (skipped in fast CI)",
    "slow: marks slow tests",
]

[tool.semantic_release]
assets = []
build_command_env = []
commit_message = "chore: v{version} [release]"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
allow_zero_version = true
no_git_verify = false
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/raylings/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "(main)"
prerelease_token = "rc"
prerelease = false

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test", "revert"]
minor_tags = ["feat"]
patch_tags = ["chore", "fix", "perf", "style", "refactor", "revert"]
default_bump_level = 0

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.commitizen]
name = "cz_customize"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:project.version",
    "src/raylings/__init__.py:__version__",
]
update_changelog_on_bump = true
allowed_types = ["chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test", "revert"]

[tool.commitizen.customize]
message_template = "{{type}}{% if scope %}({{scope}}){% endif %}: {{subject}}"
example = "feat: add new feature"
schema = "<type>(<scope>): <subject>"
bump_pattern = "^(feat|fix|perf|refactor|test)?(BREAKING CHANGE)?"
bump_map = {"BREAKING CHANGE" = "MAJOR", "feat" = "MINOR", "fix" = "PATCH", "perf" = "PATCH", "refactor" = "PATCH", "test" = "PATCH"}
info = "Commitizen uses the conventional commits format."

[[tool.commitizen.customize.questions]]
type = "list"
name = "type"
message = "Select the type of change you are committing"
choices = [
    {value = "chore", name = "chore: Build process or auxiliary tool changes"},
    {value = "ci", name = "ci: CI related changes"},
    {value = "docs", name = "docs: Documentation only changes"},
    {value = "feat", name = "feat: A new feature"},
    {value = "fix", name = "fix: A bug fix"},
    {value = "perf", name = "perf: Performance improvements"},
    {value = "style", name = "style: Formatting, missing semi colons, etc"},
    {value = "refactor", name = "refactor: Code change that neither fixes a bug nor adds a feature"},
    {value = "test", name = "test: Adding missing tests"},
    {value = "revert", name = "revert: Revert to a commit"}
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "What is the scope of this change? (class or file name): (press enter to skip)"

