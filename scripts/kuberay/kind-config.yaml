kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 10001
        hostPort: 10001
        protocol: TCP
      - containerPort: 8265
        hostPort: 8265
        protocol: TCP
      - containerPort: 6379
        hostPort: 6379
        protocol: TCP
  - role: worker
  - role: worker
